<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #111;
            font-family: Arial, sans-serif;
            color: white;
        }

        .game-container {
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
            font-size: 42px;
        }

        .score {
            font-size: 22px;
            margin-bottom: 15px;
        }

        #game {
            width: 500px;
            height: 500px;
            max-width: 90vw;
            max-height: 90vw;
            background: #222;
            border: 5px solid #555;
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            grid-template-rows: repeat(20, 1fr);
        }

        .cell {
            width: 100%;
            height: 100%;
        }

        .snake {
            background: #39d353;
            border-radius: 3px;
        }

        .snake-head {
            background: #7cff6b;
            border-radius: 5px;
        }

        .food {
            background: #ff3b30;
            border-radius: 50%;
            transform: scale(0.75);
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #39d353;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2bb344;
        }

        #message {
            margin-top: 15px;
            font-size: 18px;
            color: #bbb;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .score {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="game-container">

    <h1>Snake</h1>

    <div class="score">
        Score : <span id="score">0</span>
    </div>

    <div id="game"></div>

    <div id="message">
        Utilise les 4 flèches du clavier
    </div>

    <button id="restart">
        Recommencer
    </button>

</div>

<script>

    const game = document.getElementById("game");
    const scoreElement = document.getElementById("score");
    const message = document.getElementById("message");
    const restartButton = document.getElementById("restart");

    const gridSize = 20;

    let snake;
    let food;
    let direction;
    let nextDirection;
    let score;
    let gameRunning;
    let gameLoop;
    let speed;

    // Création des cases
    function createGrid() {

        game.innerHTML = "";

        for (let i = 0; i < gridSize * gridSize; i++) {

            const cell = document.createElement("div");

            cell.classList.add("cell");

            game.appendChild(cell);
        }
    }

    // Nouvelle partie
    function startGame() {

        clearInterval(gameLoop);

        snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];

        direction = {
            x: 1,
            y: 0
        };

        nextDirection = {
            x: 1,
            y: 0
        };

        score = 0;

        speed = 120;

        gameRunning = true;

        scoreElement.textContent = score;

        message.textContent =
            "Utilise les 4 flèches du clavier";

        generateFood();

        draw();

        gameLoop = setInterval(update, speed);
    }

    // Générer la nourriture
    function generateFood() {

        do {

            food = {
                x: Math.floor(Math.random() * gridSize),
                y: Math.floor(Math.random() * gridSize)
            };

        } while (
            snake.some(
                part =>
                    part.x === food.x &&
                    part.y === food.y
            )
        );
    }

    // Dessiner le jeu
    function draw() {

        const cells = game.children;

        // Nettoyage
        for (let cell of cells) {
            cell.className = "cell";
        }

        // Dessiner le serpent
        snake.forEach((part, index) => {

            const position =
                part.y * gridSize + part.x;

            if (index === 0) {
                cells[position].classList.add("snake-head");
            } else {
                cells[position].classList.add("snake");
            }
        });

        // Dessiner la nourriture
        const foodPosition =
            food.y * gridSize + food.x;

        cells[foodPosition].classList.add("food");
    }

    // Mise à jour du jeu
    function update() {

        if (!gameRunning) {
            return;
        }

        direction = nextDirection;

        const head = {
            x: snake[0].x + direction.x,
            y: snake[0].y + direction.y
        };

        // Collision avec les murs
        if (
            head.x < 0 ||
            head.x >= gridSize ||
            head.y < 0 ||
            head.y >= gridSize
        ) {
            gameOver();
            return;
        }

        // Collision avec le serpent
        if (
            snake.some(
                part =>
                    part.x === head.x &&
                    part.y === head.y
            )
        ) {
            gameOver();
            return;
        }

        snake.unshift(head);

        // Si le serpent mange la nourriture
        if (
            head.x === food.x &&
            head.y === food.y
        ) {

            score++;

            scoreElement.textContent = score;

            generateFood();

            // Accélération progressive
            speed = Math.max(55, 120 - score * 3);

            clearInterval(gameLoop);

            gameLoop = setInterval(update, speed);

        } else {

            // Retirer la queue
            snake.pop();
        }

        draw();
    }

    // Game Over
    function gameOver() {

        gameRunning = false;

        clearInterval(gameLoop);

        message.textContent =
            "Game Over ! Appuie sur Recommencer.";

    }

    // Contrôles clavier
    document.addEventListener("keydown", function(event) {

        if (
            event.key === "ArrowUp" ||
            event.key === "ArrowDown" ||
            event.key === "ArrowLeft" ||
            event.key === "ArrowRight"
        ) {

            event.preventDefault();
        }

        // Haut
        if (
            event.key === "ArrowUp" &&
            direction.y !== 1
        ) {

            nextDirection = {
                x: 0,
                y: -1
            };
        }

        // Bas
        if (
            event.key === "ArrowDown" &&
            direction.y !== -1
        ) {

            nextDirection = {
                x: 0,
                y: 1
            };
        }

        // Gauche
        if (
            event.key === "ArrowLeft" &&
            direction.x !== 1
        ) {

            nextDirection = {
                x: -1,
                y: 0
            };
        }

        // Droite
        if (
            event.key === "ArrowRight" &&
            direction.x !== -1
        ) {

            nextDirection = {
                x: 1,
                y: 0
            };
        }

    });

    // Bouton recommencer
    restartButton.addEventListener(
        "click",
        startGame
    );

    // Initialisation
    createGrid();

    startGame();

</script>

</body>
</html>
